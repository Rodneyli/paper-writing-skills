<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文写作 AI Skills 系列预告</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}

.frame{
  position:relative;
  width:1080px;
  height:1440px;
  background:#111;
  overflow:hidden;
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}

/* 信息图区域 */
.hero-img{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  width:756px;
  height:1008px;
  object-fit:contain;
}

/* 文案区域 */
.copy-area{
  position:absolute;
  top:1090px;
  left:80px;
  right:80px;
  text-align:center;
}

.copy-area .title{
  font-family:'Noto Serif SC','PingFang SC',serif;
  font-size:52px;
  font-weight:900;
  color:#F0ECE5;
  line-height:1.25;
  letter-spacing:0.02em;
  margin-bottom:24px;
}

.copy-area .divider{
  width:48px;
  height:2px;
  background:#E85D26;
  margin:0 auto 24px;
}

.copy-area .sub{
  font-size:26px;
  font-weight:400;
  color:rgba(240,236,229,0.7);
  line-height:1.6;
  margin-bottom:6px;
}

.copy-area .bottom-line{
  font-size:24px;
  font-weight:500;
  color:#E85D26;
  line-height:1.5;
  margin-top:14px;
}

/* 品牌栏 - 模式C浮层 */
.brand-overlay{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:80px;
  z-index:200;
  background:linear-gradient(transparent, rgba(0,0,0,0.55) 30%, rgba(0,0,0,0.75));
  pointer-events:none;
}
.brand-overlay .brand-bar{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 28px;
}
.brand-overlay .brand-left{
  display:flex;
  align-items:center;
  gap:12px;
  color:#fff;
}
.brand-overlay .brand-left img.avatar-img{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:1.5px solid rgba(255,255,255,0.12);
}
.brand-overlay .brand-left .name-group{
  display:flex;
  flex-direction:column;
}
.brand-overlay .brand-left .name{
  font-size:20px;
  font-weight:700;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;
  color:#ffffff;
  letter-spacing:0.5px;
  line-height:1.2;
}
.brand-overlay .brand-left .slogan{
  font-size:14px;
  font-weight:400;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;
  color:rgba(255,255,255,0.5);
  letter-spacing:0.3px;
  line-height:1.2;
}
.brand-overlay .brand-right{
  display:flex;
  align-items:center;
  gap:6px;
  color:rgba(255,255,255,0.7);
  font-size:14px;
  font-weight:500;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;
}
.brand-overlay .brand-right .emoji{font-size:20px;}
</style>
</head>
<body>
<div class="frame">
  <!-- 信息图 -->
  <img class="hero-img" src="file:///app/data/所有对话/主对话/imgs/260727_10_生图/预告信息图-工具箱-v3.jpg" alt="">

  <!-- 文案 -->
  <div class="copy-area">
    <div class="title">论文写作 AI Skills 系列</div>
    <div class="divider"></div>
    <div class="sub">提取自经典科研方法论书籍</div>
    <div class="sub">结合两篇 SSCI Q1 实战经验</div>
    <div class="bottom-line">从选题到回复审稿人 · 逐一拆解 · 提前关注</div>
  </div>

  <!-- 品牌栏 -->
  <div class="brand-overlay">
    <div class="brand-bar">
      <div class="brand-left">
        <img class="avatar-img" src="file:///app/data/所有对话/主对话/.skills/skill_cover-brand-bar/logo/头像.png" alt="">
        <div class="name-group">
          <span class="name">和Lee一起学AI</span>
          <span class="slogan">学得懂，用得上</span>
        </div>
      </div>
      <div class="brand-right">
        <span class="emoji">🦉</span>
        AI·效率·方法论
      </div>
    </div>
  </div>
</div>
</body>
</html>
