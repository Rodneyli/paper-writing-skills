<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540">
<title>XHS Card + Brand Overlay (Mode B · 渐变覆盖)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #1a1a2e;
}
.card {
  width: 540px;
  height: 960px;
  position: relative;
  overflow: hidden;
}
.card img.cover-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.gradient-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 140px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  pointer-events: none;
}
.brand-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  z-index: 1;
}
.brand-left {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
}
.brand-left img.avatar-img {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid rgba(255,255,255,0.12);
}
.brand-left .name-group {
  display: flex;
  flex-direction: column;
}
.brand-left .name {
  font-size: 20px;
  font-weight: 700;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #ffffff;
  letter-spacing: 0.5px;
  line-height: 1.2;
}
.brand-left .slogan {
  font-size: 14px;
  font-weight: 400;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.3px;
  line-height: 1.2;
}
.brand-right {
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.85);
  font-size: 14px;
  font-weight: 500;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.brand-right .emoji { font-size: 20px; }
</style>
</head>
<body>
<div class="card">
  <img class="cover-bg" src="file:///app/data/所有对话/主对话/imgs/260721_14_生图/01-封面底图.jpg" alt="cover">
  <div class="gradient-overlay"></div>
  <div class="brand-bar">
    <div class="brand-left">
      <!-- 本地截图用file://，分享用base64 -->
      <img class="avatar-img" src="file:///app/data/所有对话/主对话/skills/cover-brand-bar/logo/头像.png" alt="">
      <div class="name-group">
        <span class="name">和Lee一起学AI</span>
        <span class="slogan">学得懂，用得上</span>
      </div>
    </div>
    <div class="brand-right">
      <span class="emoji">🦉</span>
      AI·效率·方法论
    </div>
  </div>
</div>
</body>
</html>
