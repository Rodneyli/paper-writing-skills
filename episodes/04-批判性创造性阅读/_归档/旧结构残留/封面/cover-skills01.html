<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面·论文Skills第1期</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; background: #1a1a2e;
}
.card { width: 540px; }
.cover-wrap {
  width: 540px; height: 720px;
  position: relative; overflow: hidden;
}
.cover-wrap img.bg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.main-title {
  position: absolute; top: 10px; left: 0; width: 100%;
  text-align: center;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 52px; font-weight: 900; letter-spacing: 1px;
  color: #ffffff;
  -webkit-text-stroke: 11px #111111;
  paint-order: stroke fill;
  z-index: 3;
}
.sub-title {
  position: absolute; top: 92px; left: 0; width: 100%;
  text-align: center; z-index: 3;
}
.sub-title span {
  display: inline-block;
  background: #FFD233; color: #111111;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 32px; font-weight: 900; letter-spacing: 2px;
  padding: 8px 22px;
  border: 3.5px solid #111111;
  box-shadow: 5px 5px 0 #111111;
  transform: rotate(-2deg);
}
.series-badge {
  position: absolute; bottom: 16px; right: 16px; z-index: 3;
  background: #111111; color: #FFD233;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 18px; font-weight: 700; letter-spacing: 1px;
  padding: 6px 14px;
  border: 2.5px solid #FFD233;
  transform: rotate(2deg);
}
.brand-strip {
  width: 100%; background: #000000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px;
}
.brand-left { display: flex; align-items: center; gap: 12px; color: #fff; }
.brand-left img.avatar-img {
  width: 52px; height: 52px; border-radius: 50%;
  object-fit: cover; border: 1.5px solid rgba(255,255,255,0.12);
}
.brand-left .name-group { display: flex; flex-direction: column; }
.brand-left .name {
  font-size: 20px; font-weight: 700; color: #ffffff;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 0.5px; line-height: 1.2;
}
.brand-left .slogan {
  font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.5);
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 0.3px; line-height: 1.2;
}
.brand-right {
  display: flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.brand-right .emoji { font-size: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="cover-wrap">
    <img class="bg" src="file:///app/data/所有对话/主对话/imgs/260726_12_生图/cover-base-skills01.jpg" alt="">
    <div class="main-title">1个Skill榨干论文</div>
    <div class="sub-title"><span>30%读 70%想</span></div>
    <div class="series-badge">论文Skills · 第1期</div>
  </div>
  <div class="brand-strip">
    <div class="brand-left">
      <img class="avatar-img" src="file:///app/data/所有对话/主对话/skills/cover-brand-bar/logo/头像.png" alt="">
      <div class="name-group">
        <span class="name">和Lee一起学AI</span>
        <span class="slogan">学得懂，用得上</span>
      </div>
    </div>
    <div class="brand-right">
      <span class="emoji">🦉</span>
      AI·效率·方法论
    </div>
  </div>
</div>
</body>
</html>
