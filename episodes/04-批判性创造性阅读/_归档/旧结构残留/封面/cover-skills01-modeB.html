<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面·论文Skills第1期·模式B</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; background: #1a1a2e;
}
.card { width: 540px; }
.cover-wrap {
  width: 540px; height: 720px;
  position: relative; overflow: hidden;
}
.cover-wrap img.bg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.top-band {
  position: absolute; top: 0; left: 0; width: 100%; height: 52px;
  background: #FAF2DC;
  border-bottom: 3px solid #111111;
  display: flex; align-items: center; padding: 0 20px;
  z-index: 3;
}
.top-band .series {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 21px; font-weight: 900; letter-spacing: 1.5px;
  color: #111111;
}
.top-band .series .dot { color: #F5A623; margin: 0 6px; }
.main-title {
  position: absolute; top: 60px; left: 22px; width: auto;
  text-align: left;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 46px; font-weight: 900; letter-spacing: 1px;
  color: #ffffff;
  -webkit-text-stroke: 8px #111111;
  paint-order: stroke fill;
  z-index: 3;
}
.sub-title {
  position: absolute; top: 120px; left: 0; width: 100%;
  text-align: center; z-index: 3;
}
.sub-title span {
  display: inline-block;
  background: #FFD233; color: #111111;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 32px; font-weight: 900; letter-spacing: 2px;
  padding: 8px 22px;
  border: 3.5px solid #111111;
  box-shadow: 5px 5px 0 #111111;
  transform: rotate(-2deg);
}
.brand-overlay {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.85) 100%);
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 16px 22px;
  z-index: 3;
}
.brand-left { display: flex; align-items: center; gap: 12px; }
.brand-left img.avatar-img {
  width: 52px; height: 52px; border-radius: 50%;
  object-fit: cover; border: 1.5px solid rgba(255,255,255,0.25);
}
.brand-left .name-group { display: flex; flex-direction: column; }
.brand-left .name {
  font-size: 20px; font-weight: 700; color: #ffffff;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 0.5px; line-height: 1.2;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.brand-left .slogan {
  font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.75);
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 0.3px; line-height: 1.2;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.brand-right {
  display: flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,0.92); font-size: 14px; font-weight: 500;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  padding-bottom: 4px;
}
.brand-right .emoji { font-size: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="cover-wrap">
    <img class="bg" src="file:///app/data/所有对话/主对话/imgs/260726_12_生图/cover-base-skills01-skills.jpg" alt="">
    <div class="top-band"><span class="series">论文Skills<span class="dot">·</span>第1期</span></div>
    <div class="main-title">1个Skill榨干论文</div>
    <div class="sub-title"><span>30%读 70%想</span></div>
    <div class="brand-overlay">
      <div class="brand-left">
        <img class="avatar-img" src="file:///app/data/所有对话/主对话/skills/cover-brand-bar/logo/头像.png" alt="">
        <div class="name-group">
          <span class="name">和Lee一起学AI</span>
          <span class="slogan">学得懂，用得上</span>
        </div>
      </div>
      <div class="brand-right">
        <span class="emoji">🦉</span>
        AI·效率·方法论
      </div>
    </div>
  </div>
</div>
</body>
</html>
