<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文写作Skills · B0期 zotero-cite 链接卡</title>
<style>
  :root {
    --bg: #08111F;
    --panel: #0E1A2D;
    --panel-edge: #1D2B44;
    --accent: #FF7A00;
    --code-green: #62F6A8;
    --link-blue: #7AB7FF;
    --text: #E6EDF7;
    --subtext: #8EA0B8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    display: flex; flex-direction: column;
    padding: 64px 72px 56px;
    overflow: hidden;
  }
  /* 顶栏 */
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
  .brand .owl { font-size: 38px; }
  .brand .brand-name { color: var(--text); }
  .series-tag {
    font-size: 24px; color: var(--text);
    background: linear-gradient(135deg, #FF7A00, #FF9A3D);
    padding: 10px 22px; border-radius: 999px;
    font-weight: 600; letter-spacing: 1px;
  }
  /* 主区 */
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .skill-name {
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 84px; font-weight: 700; color: var(--accent);
    letter-spacing: 1px;
  }
  .skill-desc { margin-top: 22px; font-size: 44px; font-weight: 700; color: var(--text); line-height: 1.35; }
  .skill-sub { margin-top: 14px; font-size: 28px; color: var(--subtext); line-height: 1.5; }
  /* 链接面板 */
  .link-panel {
    margin-top: 52px;
    background: var(--panel);
    border: 2px solid var(--panel-edge);
    border-radius: 24px;
    padding: 34px 40px;
    display: flex; align-items: center; gap: 26px;
  }
  .gh-icon { flex-shrink: 0; width: 64px; height: 64px; }
  .link-text { min-width: 0; }
  .link-label { font-size: 24px; color: var(--subtext); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .link-url {
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 26px; color: var(--code-green);
    line-height: 1.5; word-break: break-all; overflow-wrap: anywhere;
    letter-spacing: 0.3px;
  }
  .copy-tip { margin-top: 26px; font-size: 26px; color: var(--link-blue); font-weight: 500; }
  /* 底部品牌栏 */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 36px;
    border-top: 1px solid var(--panel-edge);
  }
  .footer-left { display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 600; }
  .footer-left .owl { font-size: 33px; }
  .footer-right { font-size: 24px; color: var(--subtext); letter-spacing: 1px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="owl" aria-hidden="true">🦉</span>
      <span class="brand-name">和Lee一起学AI</span>
    </div>
    <div class="series-tag">论文写作Skills · B0期</div>
  </header>

  <main class="main">
    <h1 class="skill-name">zotero-cite</h1>
    <p class="skill-desc">AI 文献管理 Skill</p>
    <p class="skill-sub">让 AI 把文献一键写进 Zotero 库 · 一句话生成格式可变的「活引用」</p>

    <div class="link-panel">
      <svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true" fill="#E6EDF7">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <div class="link-text">
        <p class="link-label">GitHub 仓库 · 复制链接在浏览器打开</p>
        <p class="link-url">https://github.com/Rodneyli/paper-writing-skills/tree/main/zotero-cite</p>
      </div>
    </div>
    <p class="copy-tip">🔗 全选复制上方链接，浏览器打开即可获取</p>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <span class="owl" aria-hidden="true">🦉</span>
      <span>和Lee一起学AI</span>
    </div>
    <div class="footer-right">学得懂 · 用得上</div>
  </footer>
</body>
</html>
